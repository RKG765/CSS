<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        li{
            /* text-align: right; */
            font-size: 21px;
            display: inline-block;
            /* margin: 12px; */
            padding-top: 12px;
        }
        header{
            /* margin: 12px; */
            background-color: brown;
            color: azure;
            height: 60px;
            position: sticky;
            z-index: 2;
        }
        .cont{
            /* margin-top: 12px; */
            margin: auto;
            background-color: aquamarine;
            color: rgb(12, 15, 14);
            height: 50vh;
            width: 50vw;
        }
        .box{
            background-color: cadetblue;
            height: 160px;
            width: 160px;
            /* position: relative; */
            /* position: absolute; */
            position: fixed;
        }
        .box2{
            background-color: rgb(34, 124, 70);
            /* position: relative; */
            height: 160px;
            width: 160px;
        }
    </style>
</head>
<body>
   <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>Help</li>
                <li>Contacts</li>
                <li>Community</li>
            </ul>
        </nav>
   </header>
   <div class="cont">
    <p class="para1">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Molestias error recusandae, quisquam laboriosam adipisci earum a optio doloribus enim? Corporis, perferendis. Autem.</p>
    <div class="box">
        <p>I am Box.</p>
    </div>
    <div class="box2">
        <p>Box nO 2</p>
    </div>
   </div>
</body>
</html>
